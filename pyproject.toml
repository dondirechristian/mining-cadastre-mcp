[project]
name = "mining-cadastre-mcp"
version = "0.1.0"
description = "MCP server for West African public mining cadastres"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christian Aristide Dondire", email = "christian.dondire@sotechdi.bf" }]
keywords = ["mcp", "mining", "cadastre", "west-africa", "transparency", "arcgis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "mcp>=2.0",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "pdfplumber>=0.11"]

[project.scripts]
mining-cadastre-mcp = "mining_cadastre_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mining_cadastre_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
